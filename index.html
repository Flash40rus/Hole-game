<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кот-Пожиратель</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; touch-action:none;
    font-family: -apple-system, system-ui, sans-serif; }
  canvas { display:block; width:100vw; height:100vh; }
  #ui {
    position:absolute; top:15px; left:15px; color:#fff;
    font-size:18px; pointer-events:none;
    text-shadow:0 0 12px #0ff; font-weight:600;
  }
  #ui .row { margin-bottom:4px; }
  #timer-bar {
    position:absolute; top:0; left:0; height:4px;
    background:linear-gradient(90deg,#0ff,#f0f); width:100%;
    transition:width 0.1s linear;
  }
  #gameover {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font-size:22px; text-align:center;
    display:none; background:rgba(0,0,0,0.9); padding:28px 36px;
    border:2px solid #0ff; border-radius:16px;
    box-shadow:0 0 40px #0ff;
  }
  #gameover .title { font-size:28px; margin-bottom:10px; color:#0ff; }
  #gameover button {
    margin-top:18px; padding:12px 32px; font-size:18px;
    background:linear-gradient(135deg,#0ff,#f0f); border:none; border-radius:10px;
    font-weight:bold; color:#000;
  }
</style>
</head>
<body>
<div id="timer-bar"></div>
<div id="ui">
  <div class="row">🐱 Размер: <span id="score">18</span></div>
  <div class="row">⏱️ Время: <span id="time">60</span></div>
</div>
<div id="gameover">
  <div class="title">Кот обожрался</div>
  <div>Размер: <span id="finalScore">0</span></div>
  <button id="restart">Ещё раз</button>
</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR = window.devicePixelRatio || 1;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ===== ФОТО КОТА =====
const catImg = new Image();
catImg.src = 'cat.png';
let catLoaded = false;
catImg.onload = () => { catLoaded = true; };
catImg.onerror = () => { console.log('Не загрузилось фото cat.png'); };

// ===== Объекты =====
const OBJECT_TYPES = [
  { emoji: '🪙', r: 8,  points: 1 },
  { emoji: '🍕', r: 12, points: 2 },
  { emoji: '🌳', r: 20, points: 3 },
  { emoji: '🚗', r: 26, points: 5 },
  { emoji: '🏠', r: 36, points: 8 },
  { emoji: '🏢', r: 50, points: 15 },
];

let hole, objects, particles, score, timeLeft, gameActive, lastTime, shake;

function reset() {
  hole = { x: W/2, y: H/2, r: 28, targetX: W/2, targetY: H/2, vx: 0, vy: 0 };
  objects = [];
  particles = [];
  score = 28;
  timeLeft = 60;
  gameActive = true;
  shake = 0;
  for (let i = 0; i < 70; i++) spawnObject();
  document.getElementById('gameover').style.display = 'none';
  lastTime = performance.now();
}

function spawnObject() {
  const weights = OBJECT_TYPES.map((t) => {
    const diff = t.r - hole.r;
    if (diff < -20) return 8;
    if (diff < 0) return 5;
    if (diff < 10) return 2;
    return 0.5;
  });
  const total = weights.reduce((a,b)=>a+b, 0);
  let rnd = Math.random() * total;
  let idx = 0;
  for (let i = 0; i < weights.length; i++) {
    rnd -= weights[i];
    if (rnd <= 0) { idx = i; break; }
  }
  const type = OBJECT_TYPES[idx];
  let x, y, tries = 0;
  do {
    x = Math.random() * (W - 60) + 30;
    y = Math.random() * (H - 60) + 30;
    tries++;
  } while (Math.hypot(x - hole.x, y - hole.y) < hole.r + 120 && tries < 20);
  objects.push({
    x, y, r: type.r, emoji: type.emoji, points: type.points,
    rot: (Math.random() - 0.5) * 0.4,
    wobble: Math.random() * Math.PI * 2,
  });
}

function setTarget(e) {
  if (!gameActive) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  hole.targetX = touch.clientX - rect.left;
  hole.targetY = touch.clientY - rect.top;
}
canvas.addEventListener('touchstart', setTarget, { passive: false });
canvas.addEventListener('touchmove', setTarget, { passive: false });
canvas.addEventListener('mousedown', setTarget);
canvas.addEventListener('mousemove', (e) => { if (e.buttons) setTarget(e); });

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 5;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, color, size: 2 + Math.random() * 4,
    });
  }
}

function update(dt) {
  if (!gameActive) return;
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; endGame(); return; }
  document.getElementById('timer-bar').style.width = (timeLeft / 60 * 100) + '%';

  const dx = hole.targetX - hole.x;
  const dy = hole.targetY - hole.y;
  hole.vx += (dx * 0.02 - hole.vx) * 0.3;
  hole.vy += (dy * 0.02 - hole.vy) * 0.3;
  hole.x += hole.vx;
  hole.y += hole.vy;
  hole.x = Math.max(hole.r, Math.min(W - hole.r, hole.x));
  hole.y = Math.max(hole.r, Math.min(H - hole.r, hole.y));

  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    obj.wobble += dt * 2;
    const dist = Math.hypot(hole.x - obj.x, hole.y - obj.y);
    if (hole.r > obj.r && dist < hole.r * 2.5) {
      const pull = (1 - dist / (hole.r * 2.5)) * 2;
      const a = Math.atan2(hole.y - obj.y, hole.x - obj.x);
      obj.x += Math.cos(a) * pull;
      obj.y += Math.sin(a) * pull;
    }
    if (dist < hole.r + obj.r * 0.6) {
      if (hole.r > obj.r * 1.05) {
        hole.r += obj.points * 0.35;
        score = Math.floor(hole.r);
        spawnParticles(obj.x, obj.y, '#ffaa00', 8 + obj.points);
        objects.splice(i, 1);
        spawnObject();
        shake = Math.min(shake + obj.points * 0.5, 12);
      } else {
        const angle = Math.atan2(hole.y - obj.y, hole.x - obj.x);
        const overlap = (hole.r + obj.r) - dist;
        hole.x += Math.cos(angle) * overlap * 0.4;
        hole.y += Math.sin(angle) * overlap * 0.4;
        hole.vx *= 0.5; hole.vy *= 0.5;
        obj.x -= Math.cos(angle) * overlap * 0.4;
        obj.y -= Math.sin(angle) * overlap * 0.4;
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt * 1.8;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (shake > 0) shake *= 0.9;
  document.getElementById('score').textContent = score;
  document.getElementById('time').textContent = Math.ceil(timeLeft);
}

function draw() {
  ctx.save();
  if (shake > 0.5) {
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H));
  bg.addColorStop(0, '#0a0a20');
  bg.addColorStop(1, '#000005');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 60; i++) {
    const sx = (i * 137.5) % W;
    const sy = (i * 91.7) % H;
    const ss = (i % 3) * 0.5 + 0.5;
    ctx.fillRect(sx, sy, ss, ss);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  objects.forEach(obj => {
    const wob = Math.sin(obj.wobble) * 0.1;
    ctx.save();
    ctx.translate(obj.x, obj.y);
    ctx.rotate(obj.rot + wob);
    ctx.shadowColor = 'rgba(255,170,0,0.5)';
    ctx.shadowBlur = 8;
    ctx.font = `${obj.r * 2}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
    ctx.fillText(obj.emoji, 0, 0);
    ctx.restore();
  });
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  drawCat();
  ctx.restore();
}

// ===== ЖИВОЙ КОТ =====
function drawCat() {
  const { x, y, r } = hole;
  const t = performance.now() * 0.001;

  // Дыхание — пульсация
  const breathe = 1 + Math.sin(t * 3) * 0.07;
  // Покачивание из стороны в сторону
  const wobbleX = Math.sin(t * 2) * 3;
  const wobbleY = Math.cos(t * 2.5) * 3;
  // Наклон головы
  const tilt = Math.sin(t * 1.5) * 0.15;

  // Золотая аура
  const halo = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2.2);
  halo.addColorStop(0, 'rgba(255,180,80,0.55)');
  halo.addColorStop(0.5, 'rgba(255,100,200,0.25)');
  halo.addColorStop(1, 'rgba(255,100,200,0)');
  ctx.beginPath();
  ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
  ctx.fillStyle = halo;
  ctx.fill();

  // Кот
  ctx.save();
  ctx.translate(x + wobbleX, y + wobbleY);
  ctx.rotate(tilt);
  const size = r * 2.2 * breathe;

  if (catLoaded) {
    ctx.beginPath();
    ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(catImg, -size/2, -size/2, size, size);
  } else {
    ctx.font = `${size}px "Apple Color Emoji", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐱', 0, 0);
  }
  ctx.restore();

  // Неоновое кольцо
  ctx.beginPath();
  ctx.arc(x + wobbleX, y + wobbleY, r * 1.1 * breathe, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,200,100,0.9)';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 20;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Бегущий блик
  ctx.beginPath();
  const a1 = t * 2;
  ctx.arc(x + wobbleX, y + wobbleY, r * 1.1 * breathe, a1, a1 + Math.PI * 0.5);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameActive = false;
  document.getElementById('gameover').style.display = 'block';
  document.getElementById('finalScore').textContent = score;
}

document.getElementById('restart').addEventListener('click', reset);
reset();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
