<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Кот-Пожиратель</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; }
  canvas { display:block; }
  #hud {
    position:fixed; top:10px; left:10px; color:#0ff;
    font:bold 18px monospace; text-shadow:0 0 10px #0ff;
    pointer-events:none; z-index:10;
  }
  #over {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font:22px monospace; text-align:center; display:none;
    background:rgba(0,0,0,.9); padding:30px; border:2px solid #0ff;
    border-radius:16px; z-index:20;
  }
  #over button {
    margin-top:20px; padding:12px 30px; font:bold 18px monospace;
    background:#0ff; border:0; border-radius:8px;
  }
</style>
</head>
<body>
<div id="hud">Размер: <span id="sz">30</span> | Время: <span id="tm">60</span></div>
<div id="over">Кот обожрался!<br>Размер: <span id="fs">0</span><br><button onclick="start()">Ещё</button></div>
<canvas id="c"></canvas>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ===== ФОТО КОТА =====
var cat = new Image();
var catOK = false;
cat.onload = function(){ catOK = true; };
cat.onerror = function(){ console.log('Фото cat.png не найдено'); };
cat.src = 'cat.png';

// ===== СОСТОЯНИЕ ИГРЫ =====
var catX, catY, catR, tx, ty;
var prevX, prevY;
var velX = 0, velY = 0;
var items = [];
var size, time, alive;
var EMOJI = ['🪙','🍕','🌳','🚗','🏠','🏢'];
var SIZES = [10, 14, 22, 30, 42, 60];

// ===== АНИМАЦИЯ КОТА =====
var anim = {
  blinkTimer: 2,
  blinkActive: false,
  blinkCooldown: 0,
  eatSquash: 0,       // 0..1, сжатие при поедании
  tail: []            // шлейф
};

function start(){
  catX = W/2; catY = H/2; catR = 30;
  prevX = catX; prevY = catY;
  tx = W/2; ty = H/2;
  size = 30; time = 60; alive = true;
  items = [];
  anim.blinkTimer = 2;
  anim.blinkActive = false;
  anim.eatSquash = 0;
  anim.tail = [];
  for (var i = 0; i < 60; i++) addItem();
  document.getElementById('over').style.display = 'none';
}

function addItem(){
  var idx = Math.floor(Math.random() * 6);
  // Крупные объекты появляются только когда кот подрос
  if (SIZES[idx] > catR && Math.random() < 0.6) {
    idx = Math.floor(Math.random() * 3);
  }
  var r = SIZES[idx];
  var x = Math.random() * (W - 100) + 50;
  var y = Math.random() * (H - 100) + 50;
  items.push({ x:x, y:y, r:r, e:EMOJI[idx], pts:idx+1 });
}

// ===== УПРАВЛЕНИЕ =====
function move(e){
  if (!alive) return;
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  var t = e.touches ? e.touches[0] : e;
  tx = t.clientX - rect.left;
  ty = t.clientY - rect.top;
}
canvas.addEventListener('touchstart', move, {passive:false});
canvas.addEventListener('touchmove', move, {passive:false});
canvas.addEventListener('mousedown', move);
canvas.addEventListener('mousemove', function(e){ if (e.buttons) move(e); });

var last = 0;

function loop(now){
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;

  if (alive) {
    time -= dt;
    if (time <= 0) { time = 0; endGame(); }

    // Движение кота за пальцем
    catX += (tx - catX) * 0.15;
    catY += (ty - catY) * 0.15;

    // Скорость (для наклона и сжатия)
    velX = catX - prevX;
    velY = catY - prevY;
    prevX = catX;
    prevY = catY;

    // === МОРГАНИЕ ===
    anim.blinkCooldown -= dt;
    anim.blinkTimer -= dt;
    if (anim.blinkTimer <= 0 && anim.blinkCooldown <= 0) {
      anim.blinkActive = true;
      anim.blinkCooldown = 0.15; // длительность моргания
      anim.blinkTimer = 2 + Math.random() * 3; // следующее моргание через 2-5 сек
    }
    if (anim.blinkActive) {
      anim.blinkCooldown -= dt;
      if (anim.blinkCooldown <= 0) anim.blinkActive = false;
    }

    // === ЗАТУХАНИЕ СЖАТИЯ ОТ ЕДЫ ===
    anim.eatSquash *= 0.88;

    // === ШЛЕЙФ ===
    if (Math.hypot(velX, velY) > 1.5) {
      anim.tail.push({ x: catX, y: catY, r: catR, life: 1 });
    }
    for (var k = anim.tail.length - 1; k >= 0; k--) {
      anim.tail[k].life -= dt * 2.5;
      if (anim.tail[k].life <= 0) anim.tail.splice(k, 1);
    }
    if (anim.tail.length > 12) anim.tail.shift();

    // === СТОЛКНОВЕНИЯ ===
    for (var i = items.length - 1; i >= 0; i--){
      var it = items[i];
      var d = Math.hypot(catX - it.x, catY - it.y);

      // Притяжение мелких
      if (catR > it.r && d < catR * 2.5) {
        var pull = (1 - d / (catR * 2.5)) * 2;
        var a = Math.atan2(catY - it.y, catX - it.x);
        it.x += Math.cos(a) * pull;
        it.y += Math.sin(a) * pull;
      }

      if (d < catR + it.r * 0.5) {
        if (catR > it.r * 1.05) {
          catR += it.pts * 0.5;
          size = Math.floor(catR);
          anim.eatSquash = Math.min(1, 0.3 + it.pts * 0.1);
          items.splice(i, 1);
          addItem();
        } else {
          var a2 = Math.atan2(catY - it.y, catX - it.x);
          catX += Math.cos(a2) * 3;
          catY += Math.sin(a2) * 3;
          velX *= 0.5; velY *= 0.5;
        }
      }
    }

    document.getElementById('sz').textContent = size;
    document.getElementById('tm').textContent = Math.ceil(time);
  }

  draw();
  requestAnimationFrame(loop);
}

function draw(){
  // ===== ФОН =====
  var bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H));
  bg.addColorStop(0, '#0a0a20');
  bg.addColorStop(1, '#000005');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Звёзды
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (var i = 0; i < 60; i++){
    var sx = (i * 137) % W;
    var sy = (i * 91) % H;
    var ss = (i % 3) * 0.6 + 0.6;
    ctx.fillRect(sx, sy, ss, ss);
  }

  // ===== ШЛЕЙФ =====
  for (var k = 0; k < anim.tail.length; k++){
    var tr = anim.tail[k];
    var alpha = tr.life * 0.35;
    var rad = tr.r * (0.4 + tr.life * 0.6);
    var grad = ctx.createRadialGradient(tr.x, tr.y, 0, tr.x, tr.y, rad);
    grad.addColorStop(0, 'rgba(255,170,0,' + alpha + ')');
    grad.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, rad, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // ===== ОБЪЕКТЫ =====
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var j = 0; j < items.length; j++){
    var it = items[j];
    var wob = Math.sin(performance.now()/400 + j) * 0.08;
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(wob);
    ctx.shadowColor = 'rgba(255,170,0,0.5)';
    ctx.shadowBlur = 8;
    ctx.font = (it.r * 2) + 'px sans-serif';
    ctx.fillText(it.e, 0, 0);
    ctx.restore();
  }
  ctx.shadowBlur = 0;

  // ===== КОТ =====
  drawLivingCat();
}

function drawLivingCat(){
  var t = performance.now() / 1000;

  // === РАСЧЁТЫ АНИМАЦИИ ===
  var speed = Math.hypot(velX, velY);
  var cappedSpeed = Math.min(speed, 15);

  // Дыхание
  var breathe = 1 + Math.sin(t * 3) * 0.05;

  // Наклон в сторону движения (lean)
  var leanX = Math.max(-0.25, Math.min(0.25, velX * 0.02));
  var leanY = Math.max(-0.2, Math.min(0.2, velY * 0.015));

  // Squash & Stretch
  // При движении: вытягивается по направлению
  // При поедании: сплющивается вертикально (проглотил)
  var stretchX = 1 + (cappedSpeed * 0.008) - (anim.eatSquash * 0.25);
  var stretchY = 1 - (cappedSpeed * 0.005) + (anim.eatSquash * 0.35);

  // Моргание — сжимаем по Y
  if (anim.blinkActive) {
    stretchY *= 0.35;
  }

  // Лёгкое покачивание в покое
  var idleWobX = Math.sin(t * 2) * 2;
  var idleWobY = Math.cos(t * 2.4) * 2;

  // Наклон головы в покое
  var idleTilt = Math.sin(t * 1.3) * 0.08;

  var totalTilt = idleTilt + leanX;
  var drawR = catR * breathe;

  // === АУРА ===
  var aura = ctx.createRadialGradient(catX, catY, drawR * 0.6, catX, catY, drawR * 2);
  aura.addColorStop(0, 'rgba(255,180,80,0.4)');
  aura.addColorStop(0.5, 'rgba(255,100,200,0.15)');
  aura.addColorStop(1, 'rgba(255,100,200,0)');
  ctx.beginPath();
  ctx.arc(catX, catY, drawR * 2, 0, Math.PI * 2);
  ctx.fillStyle = aura;
  ctx.fill();

  // === КОТ ===
  ctx.save();
  ctx.translate(catX + idleWobX, catY + idleWobY);
  ctx.rotate(totalTilt);
  ctx.scale(stretchX, stretchY);

  if (catOK) {
    // Круглая маска для фото
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, drawR, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(cat, -drawR, -drawR, drawR * 2, drawR * 2);
    ctx.restore();
  } else {
    // Заглушка
    ctx.font = (drawR * 2) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐱', 0, 0);
  }

  ctx.restore();

  // === ЗОЛОТОЕ КОЛЬЦО (вне scale, чтобы не искажалось) ===
  ctx.beginPath();
  ctx.arc(catX + idleWobX, catY + idleWobY, drawR + 3, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,200,100,0.9)';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 18;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Бегущий блик по кольцу
  ctx.beginPath();
  var a1 = t * 2;
  ctx.arc(catX + idleWobX, catY + idleWobY, drawR + 3, a1, a1 + Math.PI * 0.5);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // === ЛАПКИ-ИСКРЫ при поедании ===
  if (anim.eatSquash > 0.3) {
    for (var i = 0; i < 5; i++){
      var ang = Math.random() * Math.PI * 2;
      var dist = drawR * (1.2 + Math.random() * 0.6);
      var px = catX + Math.cos(ang) * dist;
      var py = catY + Math.sin(ang) * dist;
      ctx.beginPath();
      ctx.arc(px, py, 3 * anim.eatSquash, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,220,100,' + anim.eatSquash + ')';
      ctx.fill();
    }
  }
}

function endGame(){
  alive = false;
  document.getElementById('over').style.display = 'block';
  document.getElementById('fs').textContent = size;
}

start();
requestAnimationFrame(loop);
</script>
</body>
</html>
